name: Deploy Valhalla App to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        working-directory: webapp

      - name: Clear Next.js build
        run: rm -rf apps/valhalla/.next
        working-directory: webapp

      - name: Build
        run: pnpm build --filter=@yggdra/valhalla --force
        working-directory: webapp

      - name: Add .nojekyll
        run: touch webapp/apps/valhalla/out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: webapp/apps/valhalla/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
