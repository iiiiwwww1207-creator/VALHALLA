<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>VALHALLA CHARITY LIVE ｜ LINE公式アカウント用画像</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+JP:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* ==========================================================
     LINE公式アカウント用の画像（@328vnfzj / VALHALLA CHARITYLIVE）
       cover = 背景画像 1200x600（2:1・2026年の推奨サイズ）
               ※ ホーム画面では下部にアカウント名が重なるので
                  下 1/4 には重要な要素を置かない
       icon  = プロフィール画像 640x640
               ※ 表示時に円形へトリミングされる。四隅は必ず切れるので
                  要素は中心に集める
     デザインはフライヤー（flyer-fusion.html）と同じ:
       黒 × クリムゾン(#C1121F) × セリフ体（Cinzel / Noto Serif JP）
     ========================================================== */
  :root{ --ink:#0c0a0b; --crimson:#C1121F; --crimson-l:#E0303C;
         --cream:#F3EDE1; --sub:rgba(243,237,225,.74); }
  *{box-sizing:border-box;margin:0;padding:0;border-radius:0}
  html,body{background:#141416}
  body{font-family:"Noto Serif JP",serif;color:var(--cream);
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;
    align-items:center;gap:40px;padding:40px 0}
  .board{position:relative;overflow:hidden;background:var(--ink);isolation:isolate;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  .board.cover{width:1200px;height:600px}
  .board.icon {width:640px;height:640px}

  /* 共通：クリムゾンの筋 */
  .vein{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
  .vein i{position:absolute;top:-10%;height:120%;transform:skewX(-12deg)}

  /* ---------- 背景画像 1200x600 ---------- */
  /* 下層：CÉ LA VI の赤いレーザーを全面に透かす */
  .cover .laser{position:absolute;inset:0;z-index:0;
    background:url('assets/charity/venue/celavi_red.jpg') center 46%/cover no-repeat;
    filter:brightness(.86) saturate(1.14) contrast(1.06)}
  /* 上層：3人。左のテキスト面に掛からないよう右へ寄せ、左端はマスクで溶かす */
  .cover .ph{position:absolute;inset:0;z-index:1;
    background:url('assets/charity/group_field.jpg') right -352px/800px auto no-repeat;
    filter:saturate(.9) contrast(1.04) brightness(.97);
    -webkit-mask-image:linear-gradient(90deg,transparent 31%,#000 52%,#000 100%);
    mask-image:linear-gradient(90deg,transparent 31%,#000 52%,#000 100%)}
  .cover .scrim{position:absolute;inset:0;z-index:2;
    background:
      linear-gradient(90deg,rgba(9,7,8,.80) 0%,rgba(9,7,8,.70) 32%,rgba(9,7,8,.42) 44%,rgba(9,7,8,.12) 58%,rgba(9,7,8,.10) 88%,rgba(9,7,8,.38) 100%),
      linear-gradient(180deg,rgba(9,7,8,.26) 0%,transparent 22%,transparent 60%,rgba(9,7,8,.74) 100%)}
  .cover .vein i.a{left:6%;width:4px;background:linear-gradient(180deg,transparent,rgba(193,18,31,.75) 45%,rgba(193,18,31,.5))}
  .cover .vein i.b{left:47%;width:2px;background:linear-gradient(180deg,transparent,rgba(193,18,31,.4) 55%,transparent)}
  .cover .tx{position:absolute;z-index:4;left:58px;top:50%;transform:translateY(-52%);width:500px}
  .cover .kick{font-family:'Bodoni Moda',serif;font-weight:500;font-size:19px;
    letter-spacing:.40em;text-indent:.40em;color:var(--crimson-l)}
  .cover h1{margin-top:16px;font-family:'Bodoni Moda',serif;font-weight:600;
    font-size:56px;line-height:1.06;letter-spacing:.06em;color:#fff}
  .cover .rule{width:120px;height:3px;background:var(--crimson);margin:22px 0 20px}
  .cover .date{font-family:'Cinzel',serif;font-weight:500;font-size:36px;
    letter-spacing:.08em;color:#fff;line-height:1}
  .cover .jp{margin-top:14px;font-weight:600;font-size:20px;letter-spacing:.10em;color:var(--sub)}

  /* ---------- プロフィール画像 640x640（円形にトリミングされる） ---------- */
  .icon{background:
      radial-gradient(ellipse 70% 55% at 50% 34%, rgba(150,26,34,.42), transparent 68%),
      linear-gradient(165deg,#150d0f 0%,#0a0709 46%,#120c0e 74%,#080608 100%)}
  /* CÉ LA VI の赤いレーザーを透かす（円形トリミング前提で中心に放射が来る位置） */
  .icon .laser{position:absolute;inset:0;z-index:0;
    background:url('assets/charity/venue/celavi_red.jpg') center 44%/cover no-repeat;
    filter:brightness(.78) saturate(1.12) contrast(1.05)}
  /* ロゴと文字が読めるよう中心を落とす */
  .icon .veil{position:absolute;inset:0;z-index:1;
    background:radial-gradient(ellipse 74% 66% at 50% 46%,
      rgba(6,4,5,.92) 0%, rgba(6,4,5,.84) 44%, rgba(6,4,5,.55) 74%, rgba(6,4,5,.68) 100%)}
  .icon .vein i.a{left:16%;width:4px;background:linear-gradient(180deg,transparent,rgba(193,18,31,.55) 50%,transparent)}
  .icon .vein i.b{left:83%;width:3px;background:linear-gradient(180deg,transparent,rgba(193,18,31,.4) 50%,transparent)}
  /* 円の内側（直径の約70%）に収める */
  .icon .in{position:absolute;z-index:3;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:0 92px;text-align:center}
  .icon .mark{width:250px;display:block;filter:drop-shadow(0 6px 20px rgba(0,0,0,.85))}
  .icon .t1{margin-top:22px;font-family:'Bodoni Moda',serif;font-weight:600;font-size:38px;
    letter-spacing:.10em;line-height:1.1;color:#fff}
  .icon .t2{margin-top:12px;font-family:'Cinzel',serif;font-weight:500;font-size:23px;
    letter-spacing:.14em;color:var(--cream)}
  /* 円形トリミングの目安（書き出しには写らない） */
  .guide{position:absolute;inset:0;z-index:9;border-radius:50%;
    box-shadow:0 0 0 9999px rgba(0,0,0,.55);pointer-events:none;display:none}
</style>
</head>
<body>

<!-- 背景画像（ホーム画面のカバー）1200x600 -->
<section class="board cover">
  <div class="laser"></div>
  <div class="ph"></div>
  <div class="scrim"></div>
  <div class="vein"><i class="a"></i><i class="b"></i></div>
  <div class="tx">
    <div class="kick">Valhalla</div>
    <h1>CHARITY LIVE</h1>
    <div class="rule"></div>
    <div class="date">2026.10.18 SUN</div>
    <div class="jp">CÉ LA VI TOKYO ／ 渋谷・17F</div>
  </div>
</section>

<!-- プロフィール画像 640x640（円形にトリミングされる） -->
<section class="board icon">
  <div class="laser"></div>
  <div class="veil"></div>
  <div class="vein"><i class="a"></i><i class="b"></i></div>
  <div class="in">
    <img class="mark" src="assets/charity/logo_gold.webp" alt="VALHALLA">
    <div class="t1">CHARITY<br>LIVE</div>
    <div class="t2">2026.10.18</div>
  </div>
  <div class="guide"></div>
</section>

</body>
</html>
