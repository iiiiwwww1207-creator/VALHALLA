<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>VALHALLA ライブ配信 告知</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@500;600;700&family=Cinzel:wght@400;500;600&family=Noto+Serif+JP:wght@500;600;700&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --crimson:#C1121F; --crimson-l:#E0303C;
    --cream:#F3EDE1; --sub:rgba(243,237,225,.74);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a0709;display:flex;flex-direction:column;align-items:center;
    gap:40px;padding:40px}

  .board{position:relative;overflow:hidden;background:#0a0709;
    display:flex;flex-direction:column;flex:none}

  /* 写真（Codex で下地処理済み） */
  .ph{position:absolute;inset:0;z-index:0;
    background:url('assets/charity/stream_base_1080x1350.jpg') center/cover no-repeat}
  /* 文字が乗る下半分をさらに沈める */
  .scrim{position:absolute;inset:0;z-index:1;
    background:linear-gradient(180deg,
      rgba(8,5,6,.30) 0%, rgba(8,5,6,.06) 9%, rgba(8,5,6,0) 20%,
      rgba(8,5,6,0) 50%, rgba(8,5,6,.34) 57%, rgba(8,5,6,.86) 66%,
      rgba(8,5,6,.96) 78%, rgba(8,5,6,.97) 100%)}
  /* クリムゾンの差し色（LPと同じ斜めの筋） */
  .vein{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:.5;
    background:
      linear-gradient(101deg,transparent 21.4%,rgba(193,18,31,.55) 21.6%,transparent 21.9%),
      linear-gradient(-79deg,transparent 77.8%,rgba(193,18,31,.36) 77.95%,transparent 78.2%)}

  .in{position:relative;z-index:3;display:flex;flex-direction:column;
    height:100%;width:100%}

  /* ロゴは下の文字群の先頭に置く（上は写真を見せるため空ける） */
  .logo{display:block;margin:0 auto;filter:drop-shadow(0 6px 22px rgba(0,0,0,.9))}
  .kick{font-family:'Cinzel',serif;font-weight:500;color:var(--crimson-l);
    text-shadow:0 3px 18px rgba(0,0,0,.95)}

  /* ── 下部：日時ブロック ── */
  .body{margin-top:auto;text-align:center;width:100%}
  .label{display:flex;align-items:center;justify-content:center}
  .label::before,.label::after{content:"";height:1px;background:rgba(193,18,31,.72);flex:1}
  .label span{font-family:'Cinzel',serif;font-weight:500;color:var(--crimson-l);
    text-transform:uppercase;white-space:nowrap}

  .date{font-family:'Bodoni Moda',serif;font-weight:600;color:#fff;line-height:.94;
    text-shadow:0 8px 40px rgba(0,0,0,.9)}
  .date .day{color:var(--crimson-l)}
  .time{font-family:'Bodoni Moda',serif;font-weight:500;color:#fff}
  .jp{font-family:"Noto Serif JP",serif;font-weight:600;color:var(--cream)}

  /* 欠席の告知：見落とされないよう枠で囲む */
  .absent{display:inline-block;border:1px solid rgba(224,48,60,.9);
    background:rgba(120,10,18,.42);
    font-family:"Noto Sans JP",sans-serif;font-weight:700;color:var(--cream)}
  .absent b{color:#fff}

  /* ══════════ 1080x1350（Instagram フィード／X） ══════════ */
  .b45{width:1080px;height:1350px}
  .b45 .in{padding:54px 62px 60px}
  .b45 .logo{width:196px;margin-top:22px}
  .b45 .kick{margin-top:8px;font-size:19px;letter-spacing:.42em;text-indent:.42em}
  .b45 .label{gap:22px;margin-bottom:26px}
  .b45 .label span{font-size:23px;letter-spacing:.40em;text-indent:.40em}
  .b45 .date{font-size:196px}
  .b45 .date .mon{font-size:86px;letter-spacing:.02em}
  .b45 .time{margin-top:18px;font-size:60px;letter-spacing:.06em}
  .b45 .jp{margin-top:20px;font-size:33px;letter-spacing:.18em;text-indent:.18em}
  .b45 .absent{margin-top:28px;padding:15px 34px 17px;font-size:27px;letter-spacing:.06em}

  /* ══════════ 1080x1920（ストーリー） ══════════ */
  .b916{width:1080px;height:1920px}
  .b916 .ph{background-position:center 34%}
  .b916 .in{padding:150px 62px 170px}
  .b916 .logo{width:224px;margin-top:26px}
  .b916 .kick{margin-top:10px;font-size:21px;letter-spacing:.42em;text-indent:.42em}
  .b916 .label{gap:24px;margin-bottom:30px}
  .b916 .label span{font-size:25px;letter-spacing:.40em;text-indent:.40em}
  .b916 .date{font-size:210px}
  .b916 .date .mon{font-size:92px}
  .b916 .time{margin-top:20px;font-size:64px;letter-spacing:.06em}
  .b916 .jp{margin-top:24px;font-size:35px;letter-spacing:.18em;text-indent:.18em}
  .b916 .absent{margin-top:32px;padding:17px 38px 19px;font-size:29px;letter-spacing:.06em}

</style>
</head>
<body>

<!-- ═══ 1080x1350 ═══ -->
<section class="board b45">
  <div class="ph"></div><div class="scrim"></div><div class="vein"></div>
  <div class="in">
    <div class="body">
      <div class="label"><span>On Air</span></div>
      <div class="date"><span class="mon">9.</span>18<span class="day">.</span><span class="mon">FRI</span></div>
      <div class="time">19:00 START</div>
      <div class="jp">ライブ配信</div>
      <img class="logo" src="assets/charity/logo_gold.webp" alt="VALHALLA">
      <div class="absent">※ <b>RAY</b> は欠席となります</div>
    </div>
  </div>
</section>

<!-- ═══ 1080x1920 ═══ -->
<section class="board b916">
  <div class="ph"></div><div class="scrim"></div><div class="vein"></div>
  <div class="in">
    <div class="body">
      <div class="label"><span>On Air</span></div>
      <div class="date"><span class="mon">9.</span>18<span class="day">.</span><span class="mon">FRI</span></div>
      <div class="time">19:00 START</div>
      <div class="jp">ライブ配信</div>
      <img class="logo" src="assets/charity/logo_gold.webp" alt="VALHALLA">
      <div class="absent">※ <b>RAY</b> は欠席となります</div>
    </div>
  </div>
</section>

</body>
</html>
